<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Apply the theme before first paint (no flash of the old design).
         The saved theme is cached by useBrandingTheme; admin is always studio. -->
    <script>
      (function () {
        var theme = 'studio';
        try {
          var path = location.pathname;
          if (path.indexOf('/admin') !== 0 && path.indexOf('/oauth') !== 0) {
            theme = sessionStorage.getItem('branding-theme-preview') || localStorage.getItem('branding-theme') || 'studio';
          }
        } catch (e) {}
        if (theme !== 'elegant') document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <title>Magnus Froste – AI Strategy &amp; Agentic AI</title>
    <meta name="description" content="AI strategist and builder with 20+ years in product and business development. Agentic AI, sovereign self-hosted AI, and working prototypes in days, not months." />
    <meta name="author" content="Magnus Froste" />
    <meta name="keywords" content="AI strategy, agentic AI, sovereign AI, MCP, product development, business development, Magnus Froste" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.froste.eu/" />

    <!-- Open Graph / Facebook -->

    <!-- Structured Data: Person -->

    {
      "@context": "https://schema.org",

      "name": "Magnus Froste",
      "url": "https://www.froste.eu",

    <!-- Structured Data: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Magnus Froste",
      "url": "https://www.froste.eu",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.froste.eu/blog?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
